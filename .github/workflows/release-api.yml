name: Release api

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "apps/api/**"
      - ".github/workflows/release-api.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - ".github/workflows/release-api.yml"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build
        working-directory: apps/api

      - uses: seheon99/build-and-deploy@v1
        with:
          service-name: joobjoob-api
          registry: ghcr.io/${{ github.repository }}-api
          context: apps/api
          dry-run: ${{ github.event_name == 'pull_request' }}
          skip-checkout: true
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-port: ${{ secrets.SSH_PORT || 22 }}
