name: Release api

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "compose.yaml"
      - "apps/api/**"
      - ".github/workflows/release-api.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "compose.yaml"
      - "apps/api/**"
      - ".github/workflows/release-api.yml"

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_id || 'joobjoob-deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build
        working-directory: apps/api

      - uses: seheon99/build-and-deploy/build@v1.5.0
        id: build
        with:
          registry: ghcr.io/${{ github.repository }}-api
          context: apps/api
          dry-run: ${{ github.event_name == 'pull_request' }}
          skip-checkout: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: seheon99/build-and-deploy/deploy@v1.5.0
        with:
          image: ${{ needs.build.outputs.image }}
          service-name: joobjoob-api
          working-directory: /srv/apps/joobjoob
          compose-file: compose.yaml
          env-file: .env
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-port: ${{ secrets.SSH_PORT || 22 }}
