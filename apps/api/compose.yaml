# Local development database. Spring Boot's docker-compose support starts this
# automatically on `./gradlew bootRun` and wires the datasource from it.
name: joobjoob-api
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=joobjoob'
      - 'POSTGRES_USER=joobjoob'
      - 'POSTGRES_PASSWORD=joobjoob' # local-only throwaway credential
    ports:
      - '5432'
