spring:
  application:
    name: joobjoob-api
  # Production credentials come only from the environment; nothing secret lives in this repo.
  # Locally, docker-compose support (compose.yaml) and, in tests, Testcontainers override these.
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway
  modulith:
    events:
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
